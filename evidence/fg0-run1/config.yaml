agent:
  step_limit: 30
  cost_limit: 0.5
environment:
  environment_class: docker
  image: lc0-env:1
  cwd: /repo
  timeout: 60
  env: {HOME: /tmp, PAGER: cat, MANPAGER: cat, PYTHONDONTWRITEBYTECODE: "1"}
  run_args: ["--rm", "--network", "none", "--user", "1000:1000", "--cap-drop", "ALL",
             "--security-opt", "no-new-privileges", "--memory", "1g", "--cpus", "1",
             "--pids-limit", "256", "-v", "/workspace/lc0/runs/run1/ws:/repo"]
