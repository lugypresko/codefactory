agent:
  step_limit: 30
  cost_limit: 0.50
  wall_time_limit_seconds: 1800
environment:
  environment_class: docker
  image: lc0-env:1
  executable: docker
  cwd: /repo
  timeout: 60
  forward_env: []
  env: {HOME: /tmp, PAGER: cat, MANPAGER: cat, PYTHONDONTWRITEBYTECODE: "1"}
  run_args: ["--rm", "--network", "none", "--user", "1000:1000", "--cap-drop", "ALL",
             "--security-opt", "no-new-privileges", "--memory", "1g", "--cpus", "1", "--pids-limit", "256",
             "--label", "lc0.run=B-pytest-first-call", "-v", "/workspace/lc0/work/runs/B-pytest-first-call/ws:/repo", "-v", "/workspace/lc0/work/runs/B-pytest-first-call/fault/bin:/opt/toolchain/bin:ro", "-v", "/workspace/lc0/work/runs/B-pytest-first-call/fault/profile.sh:/etc/profile.d/00-toolchain.sh:ro", "-v", "/workspace/lc0/work/runs/B-pytest-first-call/fault/state:/opt/toolchain/state"]
